[package]
name = "balt_correlate"
version = "0.1.0"
edition = "2021"
description = "Baltimore vacant buildings vs arrests correlation — Project 08"

[[bin]]
name = "balt_correlate"
path = "src/main.rs"

[dependencies]
csv        = "=1.3.0"
clap       = { version = "=4.4.18", features = ["derive"] }
serde      = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
comfy-table = "=7.0.1"
colored    = "=2.0.4"
thiserror  = "=1.0.58"
csvprof    = { path = "../project07/csvprofiler" }